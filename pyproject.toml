[project]
name = "quantumtrain-evaluation"
version = "0.1.0"
description = "Reproducible PennyLane QuantumTrain experiments and guided workbooks"
requires-python = ">=3.11,<3.12"
dependencies = ["pennylane>=0.40", "torch>=2.5", "scikit-learn>=1.5", "numpy", "pandas", "matplotlib", "jupyterlab", "nbclient", "nbformat", "ipykernel", "pytest", "tabulate"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qt_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
